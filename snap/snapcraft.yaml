
name: linlo
base: core24
version: '1.1'
summary: Terminal filesystem search utility
description: |
  Linlo is a free and open-source Bash filesystem
  search utility for Linux.

grade: devel
confinement: strict

apps:
  linlo:
    command: usr/bin/linlo
    plugs:
      - home
      - removable-media

parts:
  linlo:
    plugin: dump
    source: .
    source-type: local
    organize:
      linlo: usr/bin/linlo
    stage-packages:
      - bash
      - findutils
